[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qdte-lite"
version = "1.5.7"
description = "Device Tree Editor Lite - edit device trees and (dis)assemble the Qualcomm config-ELF containers that hold them"
readme = "README.md"
license = {text = "BSD-3-Clause-Clear"}
# Bounded by PySide6 (the qt extra): 6.11 supports CPython 3.10 through 3.14.
requires-python = ">=3.10,<3.15"
dependencies = [
    "pylibfdt",
]

[project.optional-dependencies]
# The Qt (PySide6) GUI frontend. Without it, only --nogui works.
qt = [
    "PySide6>=6.6",
]
all = [
    "qdte-lite[qt]",
]

[project.urls]
Homepage = "https://github.com/qualcomm/qdte-lite"

[project.scripts]
qdte-lite = "qdte_lite.cli.main:main"

[dependency-groups]
dev = [
    "ruff>=0.15",
    "mypy>=1.11",
    "pymarkdownlnt>=0.9",
]

[tool.setuptools.packages.find]
include = ["qdte_lite*"]

[tool.ruff]
target-version = "py310"
# XBLConfig is vendored Qualcomm tooling run as subprocess scripts; it is
# not maintained here and is not linted or type-checked.
extend-exclude = ["qdte_lite/core/XBLConfig"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
exclude = ["qdte_lite/core/XBLConfig"]

[tool.pymarkdown]
# Line length (MD013) is noise for prose and tables that wrap by design;
# every other rule stays on. Scope is set by scripts/check_markdown.sh,
# which lints the tracked root docs and leaves .github/ boilerplate alone.
plugins.md013.enabled = false
