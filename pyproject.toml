[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qdte-lite"
version = "1.5.7"
description = "Device Tree Editor Lite - edit device trees and (dis)assemble the Qualcomm config-ELF containers that hold them"
readme = "README.md"
license = {text = "BSD-3-Clause-Clear"}
requires-python = ">=3.7.4"
dependencies = [
    "pylibfdt",
]

[project.optional-dependencies]
# The Qt (PySide6) GUI frontend. Without it, only --nogui works.
qt = [
    "PySide6>=6.6",
]
all = [
    "qdte-lite[qt]",
]

[project.urls]
Homepage = "https://github.com/qualcomm/qdte-lite"

[project.scripts]
qdte = "qdte.cli.main:main"

[tool.setuptools.packages.find]
include = ["qdte*"]
