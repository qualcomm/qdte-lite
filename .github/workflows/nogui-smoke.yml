#
# Headless (--nogui) smoke test.
#
# `make test` drives scripts/nogui-smoketest.sh: it downloads the public
# boot-image fixtures into .test/ and verifies that --nogui edits a property
# inside each real Qualcomm container and can re-open its own reassembled
# output. Running on a PySide6-free install also enforces the invariant that
# the headless path never imports a GUI toolkit. Fixtures are public
# "test-device" boot images from Qualcomm Software Center; nothing
# proprietary is stored.

name: nogui smoketest

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nogui-smoketest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: System build and test dependencies
        run: |
          # swig builds the pylibfdt sdist; device-tree-compiler provides fdtdump.
          sudo apt-get update
          sudo apt-get install -y swig device-tree-compiler

      - name: Cache downloaded fixtures
        uses: actions/cache@v4
        with:
          path: .test/fixtures
          key: nogui-fixtures-${{ hashFiles('scripts/nogui-smoketest.sh') }}

      - name: make test
        run: make test
