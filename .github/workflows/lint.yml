#
# Static analysis: the same checks `make check-all` runs minus the smoke
# test (that lives in nogui-smoke.yml). Kept in its own workflow so a style
# or typing regression fails fast without waiting on the fixture download
# and container round-trip.

name: lint

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: System build dependencies
        run: |
          # swig builds the pylibfdt sdist, pulled in on the first `uv run`.
          sudo apt-get update
          sudo apt-get install -y swig

      - name: ASCII check
        run: make ascii

      - name: Ruff lint
        run: make lint

      - name: Ruff format check
        run: make format-check

      - name: Mypy
        run: make type

      - name: Markdown lint
        run: make markdown
